<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Smart · market making</title>
<!-- No third-party script, font or request: the page only fetches data.enc next to it and
     decrypts it in the browser (PBKDF2-SHA256 600000 rounds, AES-256-GCM). See smart/dash.py. -->
<style>
:root{--bg:#fff;--ink:#111;--t2:#555;--t3:#8c8c8c;--hair:#e2e2e2;--buy:#1f5fbf;--sell:#d9541e;--neg:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#ececec;--t2:#b0b0b0;--t3:#7d7d7d;--hair:#2c2c2c;--buy:#5b96ea;--sell:#e5743f;--neg:#ee6b62}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:1440px;margin:0 auto;padding:20px 40px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.top b{font-size:15px;font-weight:600}.top span{color:var(--t2);font-size:12px}.top a{color:inherit}.off{color:var(--neg)}
.stats{display:grid;grid-template-columns:1.25fr repeat(5,1fr);border-bottom:1px solid var(--hair)}
.st{padding:14px 18px 14px 0;min-width:0}.st+.st{padding-left:18px;border-left:1px solid var(--hair)}
.l,h3,th{font-size:11px;font-weight:500;color:var(--t2);letter-spacing:.04em;text-transform:uppercase}
.v{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:3px 0 1px;white-space:nowrap}.n{font-size:12px;color:var(--t3)}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;padding:16px 0 12px;border-bottom:2px solid var(--ink)}
h3{margin-bottom:6px}h3.s{margin-top:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--hair)}
.kv span:first-child{color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kv span:last-child{white-space:nowrap}
.neg{color:var(--neg)}.mut{color:var(--t3)}
#c1{position:relative}#tip{position:absolute;top:0;font-size:12px;color:var(--t2);background:var(--bg);padding:0 4px;white-space:nowrap;pointer-events:none}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:right;padding:9px 0 7px 16px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{text-align:right;padding:0 0 0 16px;border-bottom:1px solid var(--hair);height:56px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;max-width:260px;overflow:hidden;text-overflow:ellipsis}
td:first-child{font-weight:500}th.c,td.c{text-align:left}td.c{width:36%}
tr.m{cursor:pointer}tr.d td{height:auto;padding:8px 0 14px;text-align:left}
.rg{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--t3);margin-bottom:4px}.rg a{cursor:pointer}.rg a.on{color:var(--ink);border-bottom:1px solid var(--ink)}.rg span{margin-left:auto}.rg i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin:0 5px 0 14px}
.key{float:right;text-transform:none;letter-spacing:0;color:var(--t3)}.key i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 4px 0 12px}
.pb{display:inline-block;width:70px;height:3px;background:var(--hair);vertical-align:middle;margin-left:8px}.pb i{display:block;height:3px;background:var(--ink)}
svg{display:block}svg text{font-size:11px;fill:var(--t3)}
#gate{max-width:280px;margin:24vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:10px}
#gate b{font-size:15px;font-weight:600;padding-bottom:10px;border-bottom:2px solid var(--ink)}
#gate input,#gate button{font:inherit;padding:8px 10px;border:1px solid var(--t3);background:var(--bg);color:var(--ink);border-radius:0}
#gate button{background:var(--ink);border-color:var(--ink);color:var(--bg);cursor:pointer}
#err{color:var(--neg);min-height:1.4em;font-size:12px}
[hidden]{display:none!important}
@media (max-width:900px){#app{padding:14px 16px 30px}.stats{grid-template-columns:1fr 1fr}.st,.st+.st{padding:10px 0;border-left:0;border-bottom:1px solid var(--hair)}.mid{grid-template-columns:minmax(0,1fr);gap:18px}.v{font-size:22px}}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <b>Smart · market making</b>
  <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
  <button type="submit">Enter</button>
  <div id="err" role="alert"></div>
</form>
<div id="app" hidden>
  <div class="top"><b>Smart · market making</b><span id="status"></span></div>
  <div class="stats" id="stats"></div>
  <div class="mid"><div><h3>Portfolio P&amp;L, $</h3><div id="c1"></div></div><div id="side"></div></div>
  <div class="wrap"><table><thead><tr><th>Market</th><th class="c">Price and fills<span class="key"><i style="background:var(--buy)"></i>buy<i style="background:var(--sell)"></i>sell<span style="margin-left:12px">area = notional</span></span></th>
    <th>P&amp;L</th><th>At risk</th><th>% of capital</th><th>Inventory</th><th id="gh1" hidden>Delta</th><th id="gh2" hidden>Impl. vol</th><th>Fills</th><th>Status</th></tr></thead><tbody id="mk"></tbody></table></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=(v,d=2)=>Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(v,d=2)=>v==null?"…":(v>0?"+":v<0?"−":"")+num(v,d), su=(v,d=2)=>v==null?"…":(v>0?"+":v<0?"−":"")+"$"+num(v,d), us=(v,d=2)=>v==null?"…":(v<0?"−":"")+"$"+num(v,d), pl=(v,d=2)=>v==null?"…":(v<0?"−":"")+num(v,d), ng=v=>v<0?"neg":"";
const when=(t,o)=>new Date(t).toLocaleString("en-US",o||{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const hm=t=>when(t,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});
const SHADOW=new URLSearchParams(location.search).get("src")==="shadow", SRC=SHADOW?"data-shadow.enc":"data.enc";   // ?src=shadow: the shadow run of the live executor
const XL={resting:"Resting orders",placed:"Placed",cancelled:"Cancelled",fills:"Fills",refused:"Rejected",committed:"Committed",budget:"Budget",halt:"Halted"};
let file=null, key=null, salt=null, pwKeep=null, D=null, sel=null, rng=24;   // the password stays in memory only, to follow a new salt

async function unlock(password){      // the owner's file first, then the guest copy sealed with another password
  file=SRC; key=null;
  try{return await load(password)}catch(x){ if(x.name!=="OperationError") throw x }
  file=SRC.replace(".enc","-guest.enc"); key=null;
  try{return await load(password)}catch(_){ throw new Error("Wrong password") }
}
async function load(password){
  const r=await fetch(file+"?"+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("Data not found ("+r.status+")");
  const b=new Uint8Array(await r.arrayBuffer());
  if(dec.decode(b.slice(0,4))!=="BCM1") throw new Error("Unexpected file");
  const s=b.slice(4,20), same=salt&&s.every((x,i)=>x===salt[i]);
  if(!key||!same){
    if(password==null) throw new Error("Session expired");
    const base=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
    key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    salt=s; pwKeep=password;
  }
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(20,32),additionalData:enc.encode("BCM1")},key,b.slice(32));
  return JSON.parse(dec.decode(plain));
}

const name=m=>m.title?m.title.replace(/^Will /,"").replace(/\?$/,""):m.slug.replace(/^will-/,"").replace(/(-\d{3})+$/,"").replace(/-/g," ");
const nice=(lo,hi,n)=>{const raw=(hi-lo)/n, p=Math.pow(10,Math.floor(Math.log10(raw))), st=[1,2,5,10].map(k=>k*p).find(k=>k>=raw)||raw, o=[];
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st) o.push(Math.round(v/st)*st); return o};
const line=(pts,X,Y)=>{let d="";pts.forEach((p,i)=>{d+=(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)});return d};
function xticks(x0,x1,X,H,pb){let s=""; const n=X(x1)-X(x0)<600?1:3; for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n, px=X(x);
  s+=`<line x1="${px}" x2="${px}" y1="${H-pb}" y2="${H-pb+4}" stroke="var(--t3)"/><text x="${px+(i===n?-4:4)}" y="${H-4}" text-anchor="${i===n?"end":"start"}">${hm(D.t0+x*1000)}</text>`} return s}

function pnlChart(el){
  const W=Math.max(300,el.clientWidth), H=270, pr=44, pt=12, pb=22, pts=D.total;
  if(pts.length<2){el.innerHTML=`<svg width="${W}" height="${H}"><text x="0" y="${H/2}">Waiting for data</text></svg>`;return}
  const ys=pts.map(p=>p[1]); let lo=Math.min(0,...ys), hi=Math.max(0,...ys); if(hi-lo<.2){hi+=.1;lo-=.1} const pad=(hi-lo)*.08; lo-=pad; hi+=pad;
  const x0=pts[0][0], x1=pts[pts.length-1][0], X=v=>(v-x0)/((x1-x0)||1)*(W-pr), Y=v=>H-pb-(v-lo)/(hi-lo)*(H-pb-pt);
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Portfolio P&L">`;
  for(const v of nice(lo,hi,4)) s+=`<line x1="0" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(${v===0?"--t3":"--hair"})"/><text x="${W-pr+8}" y="${Y(v)+4}">${sg(v,Math.abs(hi-lo)<4?1:0)}</text>`;
  s+=xticks(x0,x1,X,H,pb);
  const lf=D.live_from?(D.live_from-D.t0)/1000:null;
  if(lf!=null&&lf>x0&&lf<x1){const px=X(lf), right=px<160; s+=`<line x1="${px}" x2="${px}" y1="${pt}" y2="${H-pb}" stroke="var(--t3)" stroke-dasharray="2 3"/><text x="${px+(right?6:-6)}" y="${pt+10}" text-anchor="${right?"start":"end"}">live since</text>`}
  const L=pts[pts.length-1];
  s+=`<path d="${line(pts,X,Y)}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${X(L[0])}" cy="${Y(L[1])}" r="3" fill="var(--ink)"/>`;
  s+=`<line id="xh" y1="${pt}" y2="${H-pb}" stroke="var(--t2)" hidden/><circle id="xd" r="3" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.5" hidden/></svg><div id="tip" hidden></div>`;
  el.innerHTML=s;
  const svg=el.firstChild, xh=svg.querySelector("#xh"), xd=svg.querySelector("#xd"), tip=el.lastChild;
  svg.onmousemove=e=>{const px=e.clientX-svg.getBoundingClientRect().left, t=x0+px/(W-pr)*(x1-x0); if(px<0||px>W-pr) return;
    let a=0,b=pts.length-1; while(a<b){const k=(a+b+1)>>1; if(pts[k][0]<=t) a=k; else b=k-1}
    const p=pts[a], cx=X(p[0]); xh.setAttribute("x1",cx); xh.setAttribute("x2",cx); xd.setAttribute("cx",cx); xd.setAttribute("cy",Y(p[1]));
    xh.removeAttribute("hidden"); xd.removeAttribute("hidden"); tip.hidden=false; tip.textContent=hm(D.t0+p[0]*1000)+"  "+su(p[1]);
    tip.style.left=Math.min(Math.max(0,cx-60),W-pr-150)+"px"};
  svg.onmouseleave=()=>{xh.setAttribute("hidden","");xd.setAttribute("hidden","");tip.hidden=true};
}

const quotes=m=>m.ord?m.ord.map(o=>[o[0],o[1],o[3]]):(m.qt||[]);     // shadow: [s, bid, size, ask, size]; paper: [s, bid, ask]
function priceChart(m,W,H,full){
  if(!m.nav.length) return `<svg width="${W}" height="${H}"><text x="0" y="${H/2+4}">no book yet</text></svg>`;
  const pr=full?52:44, pt=full?12:5, pb=full?22:5, end=m.nav[m.nav.length-1][0], from=full&&rng?end-rng*3600:-Infinity;
  let i0=0; while(i0<m.nav.length-1&&m.nav[i0+1][0]<=from) i0++;          // one point before the window, so the line starts at its edge
  const nav=m.nav.slice(i0), fl=m.fl.filter(f=>f[0]>=from), qt=full?quotes(m):[], xs=nav.map(p=>p[0]);
  const x0=full?Math.max(from,D.total[0]?.[0]??xs[0],rng?-Infinity:xs[0]):xs[0], x1=Math.max(end,x0+1);
  const ys=nav.map(p=>p[2]).concat(fl.map(f=>f[2]), qt.filter((q,i)=>(qt[i+1]?.[0]??x1)>=x0).flatMap(q=>[q[1],q[2]]).filter(v=>v!=null));
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*.15||.01; lo-=pad; hi+=pad;
  const X=v=>2+(Math.max(v,x0)-x0)/(x1-x0)*(W-pr-2), Y=v=>H-pb-(v-lo)/(hi-lo)*(H-pb-pt);
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Price and fills">`;
  if(full){for(const v of nice(lo,hi,5)) s+=`<line x1="0" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--hair)"/><text x="${W-pr+8}" y="${Y(v)+4}">${num(v,3)}</text>`; s+=xticks(x0,x1,X,H,pb)}
  for(const [col,c] of [[1,"--buy"],[2,"--sell"]]){let d="", on=false;      // our resting quotes, as steps; a gap when nothing rested
    qt.forEach((q,i)=>{const t1=qt[i+1]?.[0]??x1, v=q[col]; if(t1<x0||v==null){on=false;return}
      d+=(on?"V"+Y(v).toFixed(1):"M"+X(q[0]).toFixed(1)+" "+Y(v).toFixed(1))+"H"+X(t1).toFixed(1); on=true});
    if(d) s+=`<path d="${d}" fill="none" stroke="var(${c})" stroke-width="1" stroke-opacity=".8"/>`}
  s+=`<path d="${line(nav.map(p=>[p[0],p[2]]),X,Y)}" fill="none" stroke="var(--ink)" stroke-width="${full?1.25:1}" stroke-linejoin="round"/>`;
  const k=full?2:.9, cap=full?16:9;
  for(const f of fl){const usd=f[2]*f[3]; s+=`<circle cx="${X(f[0]).toFixed(1)}" cy="${Y(f[2]).toFixed(1)}" r="${Math.min(cap,Math.max(1.6,Math.sqrt(usd)*k)).toFixed(1)}" fill="var(${f[1]>0?"--buy":"--sell"})" fill-opacity=".75" stroke="var(--bg)" stroke-width="${full?1:0}">`+
    (full?`<title>${hm(D.t0+f[0]*1000)} · ${f[1]>0?"buy":"sell"} ${num(f[3],1)} shares at ${num(f[2],3)} · ${us(usd)} · inventory ${pl(f[4],1)}</title>`:"")+`</circle>`}
  if(!full){const l=m.nav[m.nav.length-1][2]; s+=`<text x="${W-pr+6}" y="${Y(l)+4}" style="fill:var(--t2)">${num(l,3)}</text>`}
  return s+"</svg>";
}
const detail=(m,W)=>`<div class="rg">${[[6,"6h"],[24,"24h"],[0,"all"]].map(([h,l])=>`<a data-h="${h}" class="${rng===h?"on":""}">${l}</a>`).join("")}`+
  (quotes(m).length?`<span><i style="background:var(--buy)"></i>our bid<i style="background:var(--sell)"></i>our ask</span>`:"")+`</div>`+priceChart(m,W,260,true);

function draw(){
  const age=Math.round((Date.now()-D.updated)/1000), stale=age>240, cap=D.capital??100, G=D.greeks;
  $("status").innerHTML=`${D.mode==="shadow"?"Shadow mode":"Paper simulation"} &nbsp;·&nbsp; <a href="${SHADOW?"?":"?src=shadow"}">${SHADOW?"view paper":"view shadow"}</a> &nbsp;·&nbsp;${D.guest?" guest view &nbsp;·&nbsp;":""} capital ${us(cap,0)} &nbsp;·&nbsp; ${when(D.updated)} &nbsp;·&nbsp; <span class="${stale?"off":""}">${stale?"offline for "+Math.round(age/60)+" min":"live"}</span>`;
  const n=D.markets.reduce((a,m)=>a+m.fills,0), vol=D.markets.reduce((a,m)=>a+m.fl.reduce((x,f)=>x+f[2]*f[3],0),0), h=D.hourly||{n:0};
  const st=(l,v,nn,c)=>`<div class="st"><div class="l">${l}</div><div class="v ${c||""}">${v}</div><div class="n">${nn}</div></div>`;
  $("stats").innerHTML=st("P&L",su(D.total_mid),"if liquidated "+su(D.total_liq),ng(D.total_mid))+
    st("Capital at risk",us(D.invested),D.invested==null?"":num(100*D.invested/cap,1)+"% of capital")+
    st("Sharpe · hourly",h.sharpe==null?"…":pl(h.sharpe),h.n+" hour"+(h.n>1?"s":"")+", not annualized")+
    st("Variance · hourly",h.var==null?"…":num(h.var,h.var<1?4:2)+" $²",h.var==null?h.n+" hour"+(h.n>1?"s":""):"std dev "+us(Math.sqrt(h.var)))+
    st("Max drawdown",D.dd==null?"…":us(-D.dd),"peak to trough")+st("Fills",n.toLocaleString("en-US"),"volume "+us(vol,0));
  pnlChart($("c1"));
  const kv=(a,b,c)=>`<div class="kv"><span title="${esc(a)}">${esc(a)}</span><span class="${c||""}">${b}</span></div>`;
  let side=`<h3>P&amp;L attribution</h3>`+kv("Spread capture",su(D.spread),ng(D.spread))+kv("Inventory P&L",D.spread==null?"…":su(D.total_mid-D.spread),ng(D.total_mid-D.spread));
  if(G) side+=`<h3 class="s" title="One-touch model, ${esc(G.source)}. Delta and gamma per +1% BTC, vega per +1 vol point.">Greeks · BTC ${us(G.spot,0)}</h3>`+[["Delta",G.delta,2],["Gamma",G.gamma,3],["Vega",G.vega,2],["Theta · per day",G.theta,2]].map(([a,v,d])=>kv(a,G.priced?su(v,d)+(a==="Delta"&&D.limits?` / ±${num(D.limits.delta)}`:""):"n/a",G.priced?(a==="Delta"&&D.limits&&Math.abs(v)>=D.limits.delta?"neg":""):"mut")).join("");
  const ex=Object.entries(D.exposure||{}).sort((a,b)=>b[1]-a[1]), cnt=u=>D.markets.filter(m=>m.under===u).length;
  side+=`<h3 class="s">Exposure</h3>`+ex.map(([u,v])=>{const c=cnt(u), one=D.markets.find(m=>m.under===u); return kv(c>1||!one||one.slug!==u?`${u} · ${c} market${c>1?"s":""}`:name(one),us(v))}).join("");
  const S=D.scan, stop=D.markets.filter(m=>m.stopped).length, gone=D.missing||[], miss=gone.filter(x=>!D.markets.some(m=>m.slug===x));
  side+=`<h3 class="s">Status</h3>`+kv("Markets quoted",(D.markets.length-stop-(gone.length-miss.length))+" / "+(D.markets.length+miss.length))+(stop?kv("Stopped out",stop,"neg"):"")+(gone.length?kv("Not in the recorder",gone.length,"neg"):"");
  if(D.execution) side+=`<h3 class="s">Execution</h3>`+Object.entries(D.execution).filter(([,v])=>v!==null&&typeof v!=="object").map(([k,v])=>kv(XL[k]||k,typeof v==="number"?(Number.isInteger(v)?v:num(v)):v===true?"yes":v===false?"no":esc(v),k==="halt"&&v?"neg":"")).join("");
  if(S) side+=`<h3 class="s">Market scan · ${when(S.generated,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false})} · ${S.measured} markets</h3>`+kv("Selected",S.selected.length)+kv("Selected, not quoted",S.new.length,S.new.length?"neg":"")+kv("Quoted, not selected",S.dropped.length,S.dropped.length?"neg":"");
  $("side").innerHTML=side;
  $("gh1").hidden=$("gh2").hidden=!G;
  const cols=G?10:8, g=m=>G?`<td>${m.delta==null?'<span class="mut">n/a</span>':sg(m.delta)}</td><td>${m.iv==null?'<span class="mut">n/a</span>':num(100*m.iv,0)+"%"}</td>`:"";
  $("mk").innerHTML=D.markets.map(m=>`<tr class="m" data-id="${esc(m.slug)}"><td title="${esc(name(m))}">${esc(name(m))}</td><td class="c"></td><td class="${ng(m.pnl_mid)}">${sg(m.pnl_mid)}</td><td>${m.risk==null?"…":num(m.risk)}</td>`+
    `<td>${m.risk==null?"…":num(100*m.risk/cap,1)+`<span class="pb"><i style="width:${Math.min(100,100*m.risk/Math.max(...D.markets.map(k=>k.risk||0),.01))}%"></i></span>`}</td><td>${pl(m.inv,1)}</td>${g(m)}<td>${m.fills}</td>`+
    `<td class="${m.stopped||gone.includes(m.slug)?"neg":"mut"}">${gone.includes(m.slug)?"missing":m.stopped?"stopped":m.held?"reduce only":m.fills?"active":"waiting"}</td></tr>`+(sel===m.slug?`<tr class="d"><td colspan="${cols}"></td></tr>`:"")).join("")+
    (S?S.new:[]).map(s=>`<tr><td title="${esc(s)}">${esc(name({slug:s}))}</td><td class="c mut">selected by the scan, not quoted</td><td colspan="${cols-3}"></td><td class="mut">candidate</td></tr>`).join("")+
    miss.map(s=>`<tr><td title="${esc(s)}">${esc(name({slug:s}))}</td><td class="c mut">not recorded today</td><td colspan="${cols-3}"></td><td class="neg">missing</td></tr>`).join("");
  for(const tr of $("mk").querySelectorAll("tr.m")){const m=D.markets.find(k=>k.slug===tr.dataset.id), c=tr.children[1]; c.innerHTML=priceChart(m,Math.max(220,c.clientWidth-16),46,false);
    const d=tr.nextElementSibling; if(d&&d.className==="d") d.firstChild.innerHTML=detail(m,Math.max(300,$("mk").clientWidth))}
}
$("mk").addEventListener("click",e=>{const a=e.target.closest(".rg a"); if(a){rng=+a.dataset.h; draw(); return} const tr=e.target.closest("tr.m"); if(tr){sel=sel===tr.dataset.id?null:tr.dataset.id; draw()}});
let rz; addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>D&&draw(),150)});

$("gate").addEventListener("submit",async e=>{
  e.preventDefault(); $("err").textContent="…";
  try{
    D=await unlock($("pw").value); $("pw").value=""; $("gate").hidden=true; $("app").hidden=false; draw();
    setInterval(async()=>{try{D=await load(pwKeep)}catch(_){/* keep the last picture; the next tick retries */} draw()},60000);
  }catch(x){ key=null; $("err").textContent=x.name==="OperationError"?"Wrong password":x.message }
});
</script>
</body>
