<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>SMART MM</title>
<!-- No third-party script, font or request: the page only fetches data.enc next to it and
     decrypts it in the browser (PBKDF2-SHA256 600000 rounds, AES-256-GCM). See smart/dash.py. -->
<style>
:root{--bg:#07090c;--panel:#0e1216;--row:#131920;--line:#1d2630;--fg:#d9dfe7;--muted:#77838f;--amber:#f2a33a;--up:#35c97b;--down:#ff5a52;--pnl:#5ab8f5;--mid:#56616d;
 --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.35 var(--mono);font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.brand{color:var(--amber);font-weight:700;letter-spacing:.08em}
.tag{color:var(--bg);background:var(--amber);padding:0 5px;margin-left:8px;font-weight:700}
.st{color:var(--muted);display:flex;gap:14px;align-items:center;white-space:nowrap}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:5px}.led.stale{background:var(--down)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi div{background:var(--panel);padding:6px 10px}
.kpi b{display:block;color:var(--muted);font-weight:400;font-size:10px;letter-spacing:.08em}
.kpi span{font-size:17px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:1px;background:var(--line)}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--bg);min-width:0}
.h{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;background:var(--panel);color:var(--amber);font-size:10px;letter-spacing:.1em;border-bottom:1px solid var(--line)}
.h span{color:var(--muted);letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:3px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400;font-size:10px;letter-spacing:.06em;position:sticky;top:0;background:var(--bg)}
th:first-child,td:first-child{text-align:left;padding-left:10px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--row)}
tr.sel{background:var(--row);box-shadow:inset 2px 0 0 var(--amber)}
#blot tr{cursor:default}
svg{display:block;width:100%;height:auto}
svg text{font:10px var(--mono);fill:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:14px;padding:4px 10px;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}
.lg i{display:inline-block;margin-right:5px;vertical-align:middle}
.ln{width:14px;height:2px;background:var(--pnl)}.ln.m{background:var(--mid)}.ln.s{background:var(--amber)}
.bb{width:8px;height:8px;border-radius:50%;background:var(--up);opacity:.7}.bb.v{background:var(--down)}
#gate{max-width:300px;margin:22vh auto 0;padding:0 16px;display:flex;flex-direction:column;gap:8px}
#gate input,#gate button{font:13px var(--mono);padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:0}
#gate input:focus{outline:1px solid var(--amber)}
#gate button{background:var(--amber);border-color:var(--amber);color:#000;font-weight:700;cursor:pointer;letter-spacing:.08em}
#err{color:var(--down);min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <div class="brand">SMART MM<span class="tag">PAPER</span></div>
  <input id="pw" type="password" placeholder="mot de passe" aria-label="Mot de passe" autofocus>
  <button type="submit">ENTRER</button>
  <div id="err" role="alert"></div>
</form>
<div id="app" hidden>
  <div class="bar"><div class="brand">SMART MM<span class="tag">PAPER</span></div><div class="st"><span id="age"></span><span id="upd"></span><span id="clock"></span></div></div>
  <div class="kpi" id="kpi"></div>
  <div class="main">
    <div class="pane">
      <div class="h">MARCHÉS</div>
      <div class="scroll" style="max-height:38vh"><table><thead><tr><th>MARCHÉ</th><th>MID</th><th>P&amp;L</th><th>LIQ</th><th>DD</th><th>EXÉC</th><th>A/V</th><th>STOCK</th><th>ÉT</th></tr></thead><tbody id="mk"></tbody></table></div>
      <div class="h">EXÉCUTIONS <span id="bn"></span></div>
      <div class="scroll" style="max-height:max(220px,calc(100vh - 470px))"><table><thead><tr><th>MARCHÉ</th><th>UTC</th><th>SENS</th><th>PARTS</th><th>PRIX</th><th>USD</th><th>STOCK</th></tr></thead><tbody id="blot"></tbody></table></div>
    </div>
    <div class="pane">
      <div class="h">P&amp;L <span id="ct"></span></div>
      <div id="c1"></div>
      <div class="h">STOCK (PARTS)</div>
      <div id="c2"></div>
      <div class="lg"><span><i class="ln"></i>P&amp;L USD</span><span><i class="ln m"></i>MID (DROITE)</span><span><i class="bb"></i>ACHAT</span><span><i class="bb v"></i>VENTE</span><span>BULLE = MONTANT USD</span><span>ÉT : OK ACTIF, ST STOP, ·· ATTENTE</span></div>
    </div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder();
const sg=(v,d=2)=>(v>0?"+":"")+v.toFixed(d), cl=v=>v>0?"up":v<0?"down":"mut";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=t=>new Date(t).toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
let key=null, salt=null, pwKeep=null, D=null, sel="";   // the password stays in memory only, to follow a new salt

async function load(password){
  const r=await fetch("data.enc?"+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("données introuvables ("+r.status+")");
  const b=new Uint8Array(await r.arrayBuffer());
  if(dec.decode(b.slice(0,4))!=="BCM1") throw new Error("fichier inattendu");
  const s=b.slice(4,20), same=salt&&s.every((x,i)=>x===salt[i]);
  if(!key||!same){
    if(password==null) throw new Error("session expirée");
    const base=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
    key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    salt=s; pwKeep=password;
  }
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(20,32),additionalData:enc.encode("BCM1")},key,b.slice(32));
  return JSON.parse(dec.decode(plain));
}

function chart(W,H,series,o){
  const m={l:48,r:o.right?42:8,t:8,b:20}, w=W-m.l-m.r, h=H-m.t-m.b;
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])); if(!xs.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">AUCUNE DONNÉE</text></svg>`;
  const x0=o.x0??Math.min(...xs), x1=o.x1??Math.max(...xs,x0+1);
  const rng=a=>{const ys=series.filter(s=>s.axis===a).flatMap(s=>s.pts.map(p=>p[1]));if(!ys.length)return null;
    let lo=Math.min(...ys,a?Infinity:0), hi=Math.max(...ys,a?-Infinity:0); if(hi-lo<1e-9){hi+=.5;lo-=.5} const p=(hi-lo)*.08; return [lo-p,hi+p]};
  const R=[rng(0),rng(1)], X=x=>m.l+(x-x0)/(x1-x0)*w, Y=(y,a)=>m.t+h-(y-R[a][0])/(R[a][1]-R[a][0])*h;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){const y=R[0][0]+(R[0][1]-R[0][0])*i/4, py=Y(y,0);
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${py}" y2="${py}" stroke="var(--line)"/><text x="${m.l-5}" y="${py+3}" text-anchor="end">${y.toFixed(o.dec??1)}</text>`;
    if(R[1]){const v=R[1][0]+(R[1][1]-R[1][0])*i/4; s+=`<text x="${W-m.r+5}" y="${py+3}">${v.toFixed(3)}</text>`}}
  if(R[0][0]<0&&R[0][1]>0) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0,0)}" y2="${Y(0,0)}" stroke="var(--muted)" stroke-width=".7"/>`;
  for(let i=0;i<=4;i++){const x=x0+(x1-x0)*i/4, d=new Date(o.t0+x*1000);
    s+=`<text x="${X(x)}" y="${H-5}" text-anchor="${i===0?"start":i===4?"end":"middle"}">${d.toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</text>`}
  for(const q of series){let d="",py=null;
    for(const [x,y] of q.pts){const px=X(x).toFixed(1), ny=Y(y,q.axis).toFixed(1); d+=py===null?`M${px},${ny}`:`H${px}V${ny}`; py=ny}
    s+=`<path d="${d}" fill="none" stroke="var(${q.color})" stroke-width="${q.axis?1:1.5}"${q.axis?' stroke-dasharray="2 3"':""}/>`}
  for(const b of (o.bubbles||[])){const c=b.side>0?"--up":"--down";
    s+=`<circle cx="${X(b.x).toFixed(1)}" cy="${Y(b.y,0).toFixed(1)}" r="${b.r.toFixed(1)}" fill="var(${c})" fill-opacity=".45" stroke="var(${c})" stroke-width=".8"><title>${esc(b.tip)}</title></circle>`}
  return s+"</svg>";
}

const short=s=>{s=s.replace(/^will-/,"").replace(/(-\d{3})+$/,"");return s.length>31?s.slice(0,15)+"…"+s.slice(-15):s};
function draw(){
  const now=Date.now(), age=Math.round((now-D.updated)/1000), stale=age>240;
  $("age").innerHTML=`<i class="led${stale?" stale":""}"></i>${stale?"HORS LIGNE":"EN DIRECT"}`;
  $("upd").textContent="MAJ "+hm(D.updated);
  const n=D.markets.reduce((a,m)=>a+m.fills,0), vol=D.markets.reduce((a,m)=>a+m.fl.reduce((x,f)=>x+f[2]*f[3],0),0);
  let pk=-1e9, dd=0; for(const [,v] of D.total){pk=Math.max(pk,v);dd=Math.max(dd,pk-v)}
  const hours=D.total.length?(D.total[D.total.length-1][0]-D.total[0][0])/3600:0;
  $("kpi").innerHTML=[["P&L MID",sg(D.total_mid),cl(D.total_mid)],["P&L LIQ",sg(D.total_liq),cl(D.total_liq)],["DD MAX",dd.toFixed(2),dd>0?"down":"mut"],
    ["EXÉC",n,""],["VOLUME USD",vol.toFixed(0),""],["MARGE / VOL",vol?sg(100*D.total_liq/vol,3)+"%":"",cl(D.total_liq)],
    ["MARCHÉS",D.markets.length,""],["STOPS",D.markets.filter(m=>m.stopped).length,""],["DURÉE H",hours.toFixed(1),""]]
    .map(([k,v,c])=>`<div><b>${k}</b><span class="${c}">${v}</span></div>`).join("");
  const row=(id,name,mid,p,l,d,f,bs,inv,st)=>`<tr data-id="${esc(id)}" class="${sel===id?"sel":""}"><td title="${esc(name)}">${esc(name)}</td><td>${mid}</td><td class="${cl(p)}">${sg(p)}</td><td class="${cl(l)}">${sg(l)}</td><td>${d}</td><td>${f}</td><td>${bs}</td><td>${inv}</td><td class="${st==="ST"?"down":st==="OK"?"up":"mut"}">${st}</td></tr>`;
  $("mk").innerHTML=row("","TOTAL","",D.total_mid,D.total_liq,dd.toFixed(2),n,"","","")+D.markets.map(m=>{
    const last=m.nav.length?m.nav[m.nav.length-1][2].toFixed(3):"";
    return row(m.slug,short(m.slug),last,m.pnl_mid,m.pnl,m.dd.toFixed(2),m.fills,m.buys+"/"+m.sells,m.inv.toFixed(1),m.stopped?"ST":m.fills?"OK":"··")}).join("");
  const all=D.markets.flatMap(m=>m.fl.map(f=>[m.slug,...f])).sort((a,b)=>b[1]-a[1]);
  $("bn").textContent=all.length?`${Math.min(all.length,200)} / ${all.length}`:"";
  $("blot").innerHTML=all.slice(0,200).map(f=>`<tr><td title="${esc(f[0])}">${esc(short(f[0]))}</td><td>${hm(D.t0+f[1]*1000)}</td><td class="${f[2]>0?"up":"down"}">${f[2]>0?"ACHAT":"VENTE"}</td><td>${f[4]}</td><td>${f[3]}</td><td>${(f[3]*f[4]).toFixed(2)}</td><td>${f[5]}</td></tr>`).join("");
  const x0=D.total.length?D.total[0][0]:0, x1=D.total.length?D.total[D.total.length-1][0]:1, m=D.markets.find(k=>k.slug===sel);
  if(!m){
    $("ct").textContent="TOTAL";
    $("c1").innerHTML=chart(760,330,[{pts:D.total,axis:0,color:"--pnl"}],{t0:D.t0});
    const g={}; for(const k of D.markets) for(const p of k.nav) (g[p[0]-p[0]%300]??={})[k.slug]=Math.abs(p[3]);
    const lastv={}, pts=[]; for(const t of Object.keys(g).map(Number).sort((a,b)=>a-b)){Object.assign(lastv,g[t]);pts.push([t,Object.values(lastv).reduce((a,b)=>a+b,0)])}
    $("c2").innerHTML=chart(760,150,[{pts,axis:0,color:"--amber"}],{t0:D.t0,dec:0});
  }else{
    const nav=m.nav, at=t=>{let lo=0,hi=nav.length-1,r=0;while(lo<=hi){const k=(lo+hi)>>1;if(nav[k][0]<=t){r=k;lo=k+1}else hi=k-1}return nav.length?nav[r][1]:0};
    const bub=m.fl.map(f=>({x:f[0],y:at(f[0]),side:f[1],r:Math.max(2,Math.min(15,2.3*Math.sqrt(f[2]*f[3]))),
      tip:`${hm(D.t0+f[0]*1000)}  ${f[1]>0?"ACHAT":"VENTE"} ${f[3]} @ ${f[2]}  ${(f[2]*f[3]).toFixed(2)} USD  stock ${f[4]}`}));
    $("ct").textContent=m.slug;
    $("c1").innerHTML=chart(760,330,[{pts:nav.map(p=>[p[0],p[1]]),axis:0,color:"--pnl"},{pts:nav.map(p=>[p[0],p[2]]),axis:1,color:"--mid"}],{t0:D.t0,right:true,bubbles:bub,x0,x1});
    $("c2").innerHTML=chart(760,150,[{pts:nav.map(p=>[p[0],p[3]]),axis:0,color:"--amber"}],{t0:D.t0,dec:0,x0,x1});
  }
}
$("mk").addEventListener("click",e=>{const tr=e.target.closest("tr"); if(tr){sel=tr.dataset.id; draw()}});
setInterval(()=>{$("clock").textContent=hm(Date.now())+" UTC"; if(D) $("age").firstChild.className="led"+(Date.now()-D.updated>240000?" stale":"")},1000);

$("gate").addEventListener("submit",async e=>{
  e.preventDefault(); $("err").textContent="…";
  try{
    D=await load($("pw").value); $("pw").value=""; $("gate").hidden=true; $("app").hidden=false; draw();
    setInterval(async()=>{try{D=await load(pwKeep); draw()}catch(_){/* keep the last picture; the next tick retries */}},60000);
  }catch(x){ key=null; $("err").textContent=x.name==="OperationError"?"MOT DE PASSE INCORRECT":x.message.toUpperCase() }
});
</script>
</body>
</html>
